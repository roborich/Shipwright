name: generate-builds
# SOH [fork] This repo ships two products from one workflow:
#   - "SoH (cel-shading fork)"  branch wind-waker-style-cel-shading, tags <SoH-version>-celshade<X.Y>
#   - "SoH: Unbound"            branch unbound,                      tags <SoH-version>-unbound<X.Y>
# Pushes to a release branch build all three platforms and save the ccache/deps/vcpkg caches.
# Pushing a release tag builds nothing itself: a run on a tag ref cannot read caches saved by a branch
# (only its own ref's and the default branch's), so it would build cold. It starts this workflow on
# the tag's product branch instead (workflow_dispatch with the tag as input), which reads that
# branch's caches, checks out the tag so the build sees it (the About box shows the release version
# only for a tagged commit), and publishes the release. The tag decides everything else
# (release-product.sh). Unbound is on SoH 9.3.0 ahead of the cel-shading branch, so the two copies of this
# file differ in their build steps until that branch moves too; keep the release logic the same in both.
on:
  push:
    branches:
      - wind-waker-style-cel-shading
      - unbound
      - unbound-9.3.0 # TEMPORARY: CI for the 9.3.0 move; remove before merging into unbound
    tags:
      - '*celshade*'
      - '*unbound*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (already pushed, on this branch)
        required: true
        type: string
concurrency:
  # A release run shares its branch's ref, so the event keeps a branch push and a release from
  # cancelling each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:

  # Tag push: start the release run on the product's branch.
  dispatch-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
      contents: read
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
    - name: Start the release run
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        BRANCH=$(.github/workflows/release-product.sh "$TAG" | sed -n 's/^branch=//p')
        gh workflow run generate-builds.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH" -f tag="$TAG"
        echo "Release run for ${TAG} started on ${BRANCH}"

  generate-soh-otr:
    # The build jobs below need this one, so skipping it on a tag push skips them too.
    if: github.ref_type == 'branch'
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Check the release tag
      if: inputs.tag
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        BRANCH=$(.github/workflows/release-product.sh "$TAG" | sed -n 's/^branch=//p')
        if [ "$BRANCH" != "$GITHUB_REF_NAME" ]; then
          echo "::error::${TAG} is released from ${BRANCH}; this run is on ${GITHUB_REF_NAME}"
          exit 1
        fi
        if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
          echo "::warning::${TAG} is not the head of ${BRANCH}; the build caches are the head's, so it may build cold"
        fi
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.event_name == 'push' }}
        key: ${{ runner.os }}-otr-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-otr-ccache-${{ github.ref }}
          ${{ runner.os }}-otr-ccache
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Add ccache to PATH
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
    - name: Generate soh.o2r
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
        cmake --build build-cmake --config Release --target GenerateSohOtr -j4
    - name: Upload soh.o2r
      uses: actions/upload-artifact@v7
      with:
        name: soh.o2r
        path: soh.o2r
        retention-days: 3

  build-macos:
    needs: generate-soh-otr
    runs-on: macos-14
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Setup Macports
      uses: melusina-org/setup-macports@v1
      with:
        parameters: '.github/macports.yml'
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.event_name == 'push' }}
        key: ${{ runner.os }}-14-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-14-ccache-${{ github.ref }}
          ${{ runner.os }}-14-ccache
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake -j
        # Spotlight indexing the disk image CPack just made keeps hdiutil from
        # unmounting it, failing the build with "Resource busy"
        sudo mdutil -a -i off || true
        (cd build-cmake && cpack)

        mv _packages/*.dmg SoH.dmg
        mv README.md readme.txt
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-mac
        path: |
          SoH.dmg
          readme.txt

  build-linux:
    needs: generate-soh-otr
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat linux-build-deps/apt.txt)
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.event_name == 'push' }}
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache
    - name: Restore Cached deps folder
      id: restore-cache-deps
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-deps-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-deps-${{ github.ref }}-
          ${{ runner.os }}-deps-
        path: deps
    - name: Create deps folder
      run: mkdir -p deps
    - name: Add ccache to PATH
      run: |
        echo "/usr/lib/ccache" >> "$GITHUB_PATH"
        echo "/usr/local/opt/ccache/libexec" >> "$GITHUB_PATH"
    - name: Install latest SDL
      run: |
        if [ ! -d "deps/SDL2-2.30.3" ]; then
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
        fi
        cd deps/SDL2-2.30.3
        ./configure --enable-hidapi-libusb
        make -j 10
        sudo make install
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - uses: ./.github/actions/install-sdl2-net
    - name: Copy SDL libs to multiarch dir
      run: sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/
    - name: Remove distro tinyxml2
      run: sudo apt-get remove libtinyxml2-dev
    - uses: ./.github/actions/install-tinyxml2
    - name: Install libzip without crypto
      run: |
        sudo apt-get remove -y libzip-dev
        if [ ! -d "deps/libzip-1.10.1" ]; then
          wget https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz
          tar -xzf libzip-1.10.1.tar.gz -C deps
        fi
        cd deps/libzip-1.10.1
        mkdir -p build
        cd build
        cmake .. -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF
        make
        sudo make install
        sudo cp -av /usr/local/lib/libzip* /lib/x86_64-linux-gnu/
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-cmake/soh
    - name: Build SoH
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DBUILD_REMOTE_CONTROL=1
        cmake --build build-cmake --config Release -j4
        (cd build-cmake && cpack -G External)

        mv build-cmake/*.appimage soh.appimage
      env:
        CC: gcc-12
        CXX: g++-12
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-linux
        path: soh.appimage
    - name: Save Cache deps folder
      if: ${{ github.event_name == 'push' }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-deps.outputs.cache-primary-key }}
        path: deps

  build-windows:
    needs: generate-soh-otr
    runs-on: windows-latest
    steps:
    - name: Install dependencies
      run: |
        choco install ninja -y
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - name: Git Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        max-size: "2G"
        evict-old-files: job
        save: ${{ github.event_name == 'push' }}
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache
    - name: Restore Cached VCPKG folder
      id: restore-cache-vcpkg
      uses: actions/cache/restore@v5
      with:
        key: ${{ runner.os }}-vcpkg-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-${{ github.ref }}-
          ${{ runner.os }}-vcpkg-
        path: vcpkg
    - name: Configure Developer Command Prompt
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
    - name: Download soh.o2r
      uses: actions/download-artifact@v8
      with:
        name: soh.o2r
        path: build-windows/soh
    - name: Build SoH
      env:
        VCPKG_ROOT: ${{github.workspace}}/vcpkg
      run: |
        set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
        cmake -S . -B build-windows -G Ninja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DBUILD_REMOTE_CONTROL=1
        cmake --build build-windows --config Release --parallel 10

        (cd build-windows && cpack)
        cd ..
        mv _packages/*.zip _packages/soh-windows.zip
    - name: Unzip package
      run: Expand-Archive -Path _packages/soh-windows.zip -DestinationPath soh-windows
    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: soh-windows
        path: soh-windows
    - name: Save Cache VCPKG folder
      if: ${{ github.event_name == 'push' }}
      uses: actions/cache/save@v5
      with:
        key: ${{ steps.restore-cache-vcpkg.outputs.cache-primary-key }}
        path: vcpkg

  # Fork-only: publish the GitHub Release on a release run.
  release:
    needs: [build-macos, build-linux, build-windows]
    if: inputs.tag
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
    - name: Git Checkout
      uses: actions/checkout@v6
      with:
        ref: refs/tags/${{ inputs.tag }}
        fetch-depth: 0
    - name: Identify product
      id: product
      shell: bash
      run: |
        FACTS=$(.github/workflows/release-product.sh "$TAG")
        echo "$FACTS" >> "$GITHUB_OUTPUT"
        PRODUCT=$(sed -n 's/^product=//p' <<< "$FACTS")
        # Release notes are generated against the previous tag of the same product, not the other one,
        # and never against a pipeline test tag.
        PREV=$(git tag --sort=-creatordate | grep -- "$PRODUCT" | grep -v -- '-test$' | grep -vx -- "$TAG" | head -n 1 || true)
        echo "prev=$PREV" >> "$GITHUB_OUTPUT"
    - name: Download macOS build
      uses: actions/download-artifact@v7
      with:
        name: soh-mac
        path: rel/mac
    - name: Download Linux build
      uses: actions/download-artifact@v7
      with:
        name: soh-linux
        path: rel/linux
    - name: Download Windows build
      uses: actions/download-artifact@v7
      with:
        name: soh-windows
        path: rel/windows
    - name: Package release assets
      run: |
        mkdir -p dist
        cp "rel/mac/SoH.dmg" "dist/SoH-${TAG}-Mac.dmg"
        cp "rel/linux/soh.appimage" "dist/SoH-${TAG}-Linux.appimage"
        (cd rel/windows && zip -r "../../dist/SoH-${TAG}-Win64.zip" .)
    - name: Publish GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        PRODUCT: ${{ steps.product.outputs.product }}
        TITLE: ${{ steps.product.outputs.title }}
        PREV: ${{ steps.product.outputs.prev }}
        DRAFT: ${{ steps.product.outputs.draft }}
      run: |
        NOTES_FILE=".github/release-notes/${PRODUCT}.md"
        ARGS=(--title "$TITLE" --generate-notes)
        [ -n "$PREV" ] && ARGS+=(--notes-start-tag "$PREV")
        [ -f "$NOTES_FILE" ] && ARGS+=(--notes-file "$NOTES_FILE")
        [ "$DRAFT" = true ] && ARGS+=(--draft)
        gh release create "$TAG" dist/* "${ARGS[@]}"

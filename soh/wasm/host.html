<!doctype html>
<!-- Stand-in for an embedder such as Prelude of Light: it obtains the game files by
     whatever means it likes (here, fetch; there, its own IndexedDB) and hands them to the
     module as bytes. The module is told nothing about where they came from. -->
<html lang="en">
<head><meta charset="utf-8"><title>SoH — host-supplied files</title>
<style>
  html,body{margin:0;height:100%;background:#1a1a1a;color:#ddd;font:13px ui-monospace,Menlo,monospace}
  #canvas{display:block;width:100vw;height:100vh;border:0;outline:none}
  #status{position:fixed;left:8px;top:8px;white-space:pre;text-shadow:0 1px 2px #000}
</style></head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">fetching host files…</div>
<script src="host-page.js"></script>
<script>
const statusEl = document.getElementById('status');
SohHostPage.startMemtrace(statusEl);

// --- Talking to the game (see EMBEDDING.md) -------------------------------------------
// Outbound: the game dispatches CustomEvent('soh') on window; detail.type is 'load-game',
// 'scene', 'file-saved' (path + bytes of a config/save the game wrote), 'quit' or 'error'.
// Inbound: soh('entrance cd') runs a debug-console line.
window.addEventListener('soh', e => console.log('soh event', e.detail));
window.soh = cmd => Module.ccall('Soh_RunConsoleCommand', 'number', ['string'], [cmd]);

var Module = {
  canvas: document.getElementById('canvas'),
  preRun: [() => { Module.canvas.focus(); }, () => SohHostPage.writeHostFiles(statusEl)],
  setStatus: t => { statusEl.textContent = t; if (!t) statusEl.style.display = 'none'; },
  print: (...a) => console.log(...a),
  printErr: (...a) => console.error(...a),
  onAbort: w => { statusEl.style.display=''; statusEl.textContent = 'aborted: ' + w; },
};
// The files this page hands over, and whether the boot can go on without each one.
const HOST_FILES = {
  '/oot.o2r':              { url: 'hostfiles/oot.o2r',             required: true },
  '/shipofharkinian.json': { url: 'hostfiles/shipofharkinian.json', required: false },
  '/Save/file1.sav':       { url: 'hostfiles/Save/file1.sav',       required: false },
  '/Save/global.sav':      { url: 'hostfiles/Save/global.sav',      required: false },
};

// Bytes of a file, or null when the server does not have it. Writing an error page into the
// VFS would hand the game a corrupt save.
async function fetchBytes(url) {
  const response = await fetch(url);
  return response.ok ? new Uint8Array(await response.arrayBuffer()) : null;
}

(async () => {
  const files = {};
  for (const [vfsPath, { url, required }] of Object.entries(HOST_FILES)) {
    const bytes = await fetchBytes(url);
    if (bytes) files[vfsPath] = bytes;
    else if (required) throw new Error(`${url} was not found`);
    else console.warn(`host: ${url} was not found; booting without it`);
  }
  Module.shipFiles = files;
  console.log('host: fetched files, loading module');
  const s = document.createElement('script');
  s.src = 'soh.js';
  document.body.appendChild(s);
})().catch(error => {
  SohHostPage.show(statusEl, 'host: ' + error.message);
  console.error(error);
});
</script>
</body></html>

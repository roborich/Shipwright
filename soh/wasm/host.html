<!doctype html>
<!-- Stand-in for an embedder such as Prelude of Light: it obtains the game files by
     whatever means it likes (here, fetch; there, its own IndexedDB) and hands them to the
     module as bytes. The module is told nothing about where they came from. -->
<html lang="en">
<head><meta charset="utf-8"><title>SoH — host-supplied files</title>
<style>
  html,body{margin:0;height:100%;background:#1a1a1a;color:#ddd;font:13px ui-monospace,Menlo,monospace}
  #canvas{display:block;width:100vw;height:100vh;border:0;outline:none}
  #status{position:fixed;left:8px;top:8px;white-space:pre;text-shadow:0 1px 2px #000}
</style></head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">fetching host files…</div>
<script>
const statusEl = document.getElementById('status');

function showStatus(text) {
  statusEl.style.display = '';
  statusEl.textContent = text;
}

// --- Memory trace -----------------------------------------------------------------------
// A renderer crash ("Aw, Snap") takes the console with it, so samples are kept in
// localStorage and reported on the next load. The wasm heap can grow to 2GB by default
// (Emscripten's MAXIMUM_MEMORY); an allocation past that aborts the module. Enable with
// ?memtrace, read the previous run's trail from the console after a crash.
const TRACE_KEY = 'soh-memtrace';       // the run in progress
const PREV_KEY  = 'soh-memtrace-prev';  // the last finished/crashed run, kept for reading

function reportPreviousTrace() {
  // The finished run is moved to its own key rather than deleted, so it survives any
  // number of reloads and can be read back by hand at any time:
  //   JSON.parse(localStorage.getItem('soh-memtrace-prev'))
  // Only the next run with ?memtrace overwrites it.
  try {
    const live = localStorage.getItem(TRACE_KEY);
    if (live) localStorage.setItem(PREV_KEY, live);
    localStorage.removeItem(TRACE_KEY);
    const prev = JSON.parse(localStorage.getItem(PREV_KEY) || '[]');
    if (prev.length) {
      const last = prev[prev.length - 1];
      const peak = prev.reduce((m, s) => Math.max(m, s.heapMB), 0);
      console.warn(`memtrace: previous run ran ${last.t}s, ended at ${last.heapMB} MB, ` +
                   `peak ${peak} MB (cap 2048). Trail:`);
      console.table(prev);
    } else {
      console.warn('memtrace: no previous run recorded.');
    }
  } catch (e) { /* private mode, blocked storage: tracing is optional */ }
}

function startMemtrace() {
  if (!new URLSearchParams(location.search).has('memtrace')) return;
  reportPreviousTrace();
  const started = Date.now();
  const trail = [];
  let lastTotalMB = null;
  setInterval(() => {
    const heap = Module.HEAPU8 ? Module.HEAPU8.buffer.byteLength : 0;
    if (!heap) return;
    const sample = {
      t: Math.round((Date.now() - started) / 1000),
      heapMB: Math.round(heap / 1048576),
      jsMB: performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null,
      totalMB: lastTotalMB, // whole renderer (wasm + JS + DOM + canvases); null unless cross-origin isolated
    };
    // performance.measureUserAgentSpecificMemory needs crossOriginIsolated and is async, so
    // it is requested here and lands in the next sample.
    if (self.crossOriginIsolated && performance.measureUserAgentSpecificMemory) {
      performance.measureUserAgentSpecificMemory()
        .then(m => { lastTotalMB = Math.round(m.bytes / 1048576); }, () => {});
    }
    trail.push(sample);
    if (trail.length > 600) trail.shift();   // ~10 min at 1Hz
    // The Web Audio player's counters (libultraship WebAudioAudioPlayer.js): frames queued
    // ahead of the speaker, and the render quanta the worklet had to fill with silence
    // because a frame ran longer than that queue covered (not counted while the tab is hidden).
    const audio = Module.LUSWebAudio;
    const audioText = audio
      ? `   audio ${audio.ctx.state} q${Math.max(0, audio.queued - audio.consumed - audio.dropped)} underruns ${audio.underruns}`
      : '';
    showStatus(`wasm heap ${sample.heapMB} MB` +
      (sample.jsMB !== null ? `   js ${sample.jsMB} MB` : '') +
      (sample.totalMB !== null ? `   total ${sample.totalMB} MB` : '') +
      `   (cap 2048 MB)` + audioText);
    try { localStorage.setItem(TRACE_KEY, JSON.stringify(trail)); } catch (e) {}
  }, 1000);
}

startMemtrace();

// --- Host files -------------------------------------------------------------------------
// Writes Module.shipFiles (VFS path -> bytes, see HOST-API.md) into the filesystem during
// preRun. oot.o2r is required. soh.o2r is not the page's to supply: it is packaged in
// soh.data, version-locked to the binary, and unpacked after preRun, where a copy written
// here would make the unpack fail.
function writeHostFiles() {
  const files = Module.shipFiles || {};
  if (!files['/oot.o2r']) {
    const msg = 'No game archive.\n\n' +
      'The page must supply oot.o2r. Set Module.shipFiles before loading soh.js:\n\n' +
      "  Module.shipFiles = { '/oot.o2r': bytes };\n\n" +
      'See soh/wasm/HOST-API.md.';
    showStatus(msg);
    console.error(msg);
    throw new Error('shipFiles: no /oot.o2r provided');
  }
  let written = 0;
  for (const [path, bytes] of Object.entries(files)) {
    if (path === '/soh.o2r') {
      console.warn('shipFiles: /soh.o2r is packaged in soh.data; ignoring the page\'s copy');
      continue;
    }
    const dir = path.slice(0, path.lastIndexOf('/'));
    if (dir) Module.FS.mkdirTree(dir);
    Module.FS.writeFile(path, bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes));
    written++;
  }
  console.log(`shipFiles: wrote ${written} file(s) into the VFS`);
}

// --- Talking to the game (see HOST-API.md) ----------------------------------------------
// Outbound: the game dispatches CustomEvent('soh') on window. Inbound: soh('entrance cd')
// runs a debug-console line.
window.addEventListener('soh', e => console.log('soh event', e.detail));
window.soh = cmd => Module.ccall('Soh_RunConsoleCommand', 'number', ['string'], [cmd]);

var Module = {
  canvas: document.getElementById('canvas'),
  // Keyboard input only reaches SDL when the canvas has focus.
  preRun: [() => { Module.canvas.focus(); }, writeHostFiles],
  setStatus: t => { statusEl.textContent = t; if (!t) statusEl.style.display = 'none'; },
  print: (...a) => console.log(...a),
  printErr: (...a) => console.error(...a),
  onAbort: w => showStatus('aborted: ' + w),
};

// The files this page hands over, and whether the boot can go on without each one.
const HOST_FILES = {
  '/oot.o2r':              { url: 'hostfiles/oot.o2r',             required: true },
  '/shipofharkinian.json': { url: 'hostfiles/shipofharkinian.json', required: false },
  '/Save/file1.sav':       { url: 'hostfiles/Save/file1.sav',       required: false },
  '/Save/global.sav':      { url: 'hostfiles/Save/global.sav',      required: false },
};

// Bytes of a file, or null when the server does not have it. Writing an error page into the
// VFS would hand the game a corrupt save.
async function fetchBytes(url) {
  const response = await fetch(url);
  return response.ok ? new Uint8Array(await response.arrayBuffer()) : null;
}

(async () => {
  const files = {};
  for (const [vfsPath, { url, required }] of Object.entries(HOST_FILES)) {
    const bytes = await fetchBytes(url);
    if (bytes) files[vfsPath] = bytes;
    else if (required) throw new Error(`${url} was not found`);
    else console.warn(`host: ${url} was not found; booting without it`);
  }
  Module.shipFiles = files;
  console.log('host: fetched files, loading module');
  const s = document.createElement('script');
  s.src = 'soh.js';
  document.body.appendChild(s);
})().catch(error => {
  showStatus('host: ' + error.message);
  console.error(error);
});
</script>
</body></html>
